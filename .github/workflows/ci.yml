name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Shared env stubs — safe placeholder values that satisfy lib/env.ts at import
# time. Real secrets are never stored here.
env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Fast feedback — lint + typecheck only (~30s)
  # -------------------------------------------------------------------------
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # -------------------------------------------------------------------------
  # Job 2: Build — catches Next.js build errors that typecheck misses
  # -------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # -------------------------------------------------------------------------
  # Job 3: Test + coverage
  # Runs in parallel with build (both depend only on validate).
  # Coverage thresholds will be tightened as Phase 2 tests land.
  # -------------------------------------------------------------------------
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run test:coverage
        continue-on-error: false
